[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "rampd-core"
version = "0.6.0"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
test = ["pytest>=7,<10", "mpmath>=1.2,<1.4"]
[tool.setuptools]
package-dir = {"" = "python"}
[tool.setuptools.packages.find]
where = ["python"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
